<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire Safety Inspection</title>

<style>
body{
  font-family:Arial, Helvetica, sans-serif;
  background:#2f343a;
  padding:20px;
}
header{
  display:flex;
  align-items:center;
  margin-bottom:24px;
}
header img{
  height:160px;   /* Logo 放大 ≥4 倍 */
}
header h1{
  flex:1;
  text-align:center;
  font-size:36px;
  font-weight:bold;
  white-space:nowrap;
  color:#fff;
  margin:0 20px;
}
header select{
  padding:6px;
  font-size:16px;
}

.section{
  background:#fff;
  padding:16px;
  border-radius:8px;
  margin-bottom:20px;
}

.item{
  border-top:2px solid #ddd;
  padding-top:16px;
  margin-top:16px;
}

.item h3{
  margin:0 0 12px 0;
}

.item-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

label{
  font-weight:bold;
  margin-top:10px;
  display:block;
}

select, input, textarea, button{
  width:100%;
  padding:8px;
  margin-top:6px;
  font-size:14px;
}

.followup{
  display:none;
}

.preview-list{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:6px;
}
.preview{
  position:relative;
}
.preview img{
  width:70px;
  height:70px;
  object-fit:cover;
  border:1px solid #ccc;
  cursor:pointer;
}
.preview .del{
  position:absolute;
  top:0;
  right:0;
  background:red;
  color:#fff;
  font-size:12px;
  padding:1px 4px;
  cursor:pointer;
}
.filename{
  font-size:11px;
  text-align:center;
}

footer{
  display:flex;
  justify-content:flex-end;
}

.print-btn{
  background:#0078d4;
  border:none;
  color:#fff;
  padding:10px 16px;
  font-size:16px;
  cursor:pointer;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  justify-content:center;
  align-items:center;
}
.modal img{
  max-width:90%;
  max-height:90%;
}
</style>
</head>

<body>

<header>
  <img src="logo.png" alt="Company Logo">

  <h1 data-i18n="title">
    防火安全巡查清單 Fire Safety Inspection Checklist
  </h1>

  <select onchange="setLang(this.value)">
    <option value="en">English</option>
