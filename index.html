<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inspection</title>

<style>
body{font-family:Arial;background:#f4f6f9;padding:16px}
header{display:flex;justify-content:space-between;align-items:center}
header img{height:45px}
.section{background:#fff;padding:16px;border-radius:8px;margin-top:16px}
label{font-weight:bold;display:block;margin-top:12px}
select,input,textarea,button{width:100%;padding:8px;margin-top:6px}
.preview-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.preview{position:relative}
.preview img{width:80px;height:80px;object-fit:cover;border:1px solid #ccc;cursor:pointer}
.preview span{position:absolute;top:0;right:0;background:red;color:#fff;font-size:12px;cursor:pointer}
.filename{font-size:12px;text-align:center}
.followup{display:none}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);justify-content:center;align-items:center}
.modal img{max-width:90%;max-height:90%}
</style>
</head>

<body>

<header>
  <img src="logo.png" alt="Logo">
  <select onchange="setLang(this.value)">
    <option value="zh">中(繁)</option>
    <option value="zhcn">中(簡)</option>
    <option value="en">English</option>
    <option value="ja">日本語</option>
    <option value="ko">한국어</option>
    <option value="th">ไทย</option>
    <option value="np">नेपाली</option>
    <option value="hi">हिन्दी</option>
    <option value="ar">العربية</option>
  </select>
</header>

<div class="section">
  <h2 data-i18n="title"></h2>
  <input data-i18n-placeholder="project">
  <input data-i18n-placeholder="inspector">
  <input type="date">
</div>

<div class="section">
  <label data-i18n="result"></label>
  <select id="result" onchange="onResultChange()">
    <option value="" data-i18n="select"></option>
    <option value="na" data-i18n="na"></option>
    <option value="ok" data-i18n="satisfactory"></option>
    <option value="fair" data-i18n="fair"></option>
    <option value="poor" data-i18n="poor"></option>
  </select>

  <label data-i18n="currentPhoto"></label>
  <button onclick="curInput.click()" data-i18n="upload"></button>
  <input type="file" id="curInput" multiple accept="image/*" style="display:none"
    onchange="handleFiles(this,curList)">
  <div id="curList" class="preview-list"></div>

  <div class="followup" id="followup">
    <label data-i18n="remark"></label>
    <textarea id="remark"></textarea>

    <label data-i18n="deadline"></label>
    <input type="date" id="deadline">
  </div>

  <button onclick="share()" data-i18n="share"></button>
</div>

<div class="modal" id="modal" onclick="this.style.display='none'">
  <img id="modalImg">
</div>

<script>
const dict={
zh:{title:"防火安全巡查記錄",project:"工程名稱",inspector:"巡查員",
result:"檢查結果",select:"-- 請選擇 --",na:"不適用",
satisfactory:"滿意",fair:"尚可",poor:"欠佳",
currentPhoto:"現況照片",remark:"備註",
deadline:"跟進限期",upload:"📸 上載相片",share:"📤 分享"},
en:{title:"Fire Safety Inspection Record",project:"Project Name",
inspector:"Inspector",result:"Inspection Result",
select:"-- Select --",na:"N/A",satisfactory:"Satisfactory",
fair:"Fair",poor:"Poor",currentPhoto:"Current Photos",
remark:"Remark",deadline:"Follow-up Deadline",
upload:"📸 Upload",share:"📤 Share"}
};

function setLang(l){
  document.querySelectorAll("[data-i18n]").forEach(e=>{
    e.innerText=dict[l][e.dataset.i18n];
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(e=>{
    e.placeholder=dict[l][e.dataset.i18nPlaceholder];
  });
}
setLang("zh");

function onResultChange(){
  followup.style.display=(result.value==="fair"||result.value==="poor")?"block":"none";
}

function handleFiles(input,list){
  [...input.files].forEach(f=>{
    const r=new FileReader(),div=document.createElement("div");
    div.className="preview";
    const img=document.createElement("img");
    const name=document.createElement("div");
    const del=document.createElement("span");
    name.className="filename"; name.innerText=f.name;
    del.innerText="×"; del.onclick=()=>div.remove();
    img.onclick=()=>{ modalImg.src=img.src; modal.style.display="flex"; };
    r.onload=e=>img.src=e.target.result;
    r.readAsDataURL(f);
    div.append(img,del,name); list.append(div);
  });
  input.value="";
}

function share(){
  const txt=result.options[result.selectedIndex].text;
  const msg=encodeURIComponent(`${txt}\n${remark.value||""}\n${deadline.value||""}`);
  if(confirm("WhatsApp? Cancel = Email")){
    window.open("https://wa.me/?text="+msg);
  }else{
    location="mailto:?body="+msg;
  }
}
</script>

</body>
</html>
