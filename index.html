<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire Safety Inspection</title>

<style>
body{font-family:Arial;background:#f4f6f9;padding:16px}
header{display:flex;justify-content:space-between;align-items:center}
.section{background:#fff;padding:16px;border-radius:8px;margin-top:16px}
.item{border-top:1px solid #ddd;padding-top:16px;margin-top:16px}
label{font-weight:bold;display:block;margin-top:10px}
select,input,textarea,button{width:100%;padding:8px;margin-top:6px}
.followup{display:none}
.preview-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.preview{position:relative}
.preview img{width:80px;height:80px;border:1px solid #ccc;cursor:pointer}
.preview .del{position:absolute;top:0;right:0;background:red;color:#fff;font-size:12px;padding:2px 4px;cursor:pointer}
.filename{font-size:12px;text-align:center}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);justify-content:center;align-items:center}
.modal img{max-width:90%;max-height:90%}
</style>
</head>

<body>

<header>
  <h2>Fire Safety Inspection Checklist</h2>
</header>

<div class="section">
  <label>地盤 / 工程名稱</label>
  <input>
  <label>巡查員姓名</label>
  <input>
  <label>巡查日期</label>
  <input type="date">
</div>

<div class="section" id="items"></div>

<div class="modal" id="modal" onclick="this.style.display='none'">
  <img id="modalImg">
</div>

<script>
const checklist = [
"已委派防火視察火警高危區",
"已實施禁煙政策",
"熱許可證（電焊／風焊）",
"保安巡火情況",
"工作地方收拾妥當（沒有雜物、紙皮、廢紙積聚）",
"電動消防泵及消防喉轆",
"滅火筒足夠及狀況良好",
"其他救火設施（例如灑水設備）",
"逃生設備（例如火通道）",
"警告標語（禁止吸煙／易燃物品）",
"緊急應變小組已設立及張貼緊急事故聯絡電話",
"防火安全講座",
"最近一次火警演習日期",
"其他觀察事項"
];

const container = document.getElementById("items");

checklist.forEach((text, i) => {
  container.innerHTML += `
  <div class="item">
    <h3>${i+1}. ${text}</h3>

    <label>檢查結果</label>
    <select onchange="toggleFollowup(this)">
      <option value="">-- 請選擇 --</option>
      <option value="na">不適用</option>
      <option value="ok">滿意</option>
      <option value="fair">尚可</option>
      <option value="poor">欠佳</option>
    </select>

    <label>現況相片</label>
    <button onclick="this.nextElementSibling.click()">📸 上載相片</button>
    <input type="file" multiple accept="image/*" style="display:none"
      onchange="handleFiles(this)">

    <div class="preview-list"></div>

    <div class="followup">
      <label>備註</label>
      <textarea></textarea>

      <label>跟進限期</label>
      <input type="date">

      <label>跟進相片</label>
      <button onclick="this.nextElementSibling.click()">📸 上載相片</button>
      <input type="file" multiple accept="image/*" style="display:none"
        onchange="handleFiles(this)">
      <div class="preview-list"></div>
    </div>

    <button onclick="shareItem('${text}')">📤 分享此項目</button>
  </div>
  `;
});

function toggleFollowup(sel){
  const block = sel.closest(".item").querySelector(".followup");
  block.style.display = (sel.value==="fair"||sel.value==="poor")?"block":"none";
}

function handleFiles(input){
  const list = input.nextElementSibling;
  [...input.files].forEach(f=>{
    const div=document.createElement("div");
    div.className="preview";
    const img=document.createElement("img");
    const del=document.createElement("div");
    const name=document.createElement("div");

    del.className="del"; del.innerText="×";
    del.onclick=()=>div.remove();
    name.className="filename"; name.innerText=f.name;

    const r=new FileReader();
    r.onload=e=>img.src=e.target.result;
    r.readAsDataURL(f);
    img.onclick=()=>{ modalImg.src=img.src; modal.style.display="flex"; };

    div.append(img,del,name);
    list.append(div);
  });
  input.value="";
}

function shareItem(text){
  const msg=encodeURIComponent("Fire Safety Inspection:\n"+text);
  if(confirm("WhatsApp? Cancel = Email")){
    window.open("https://wa.me/?text="+msg);
  }else{
    location="mailto:?body="+msg;
  }
}
</script>

</body>
</html>
